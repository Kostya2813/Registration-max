<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Max — вход</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 font-family:Arial,Helvetica,sans-serif;
 background:#17181c;color:#fff;overflow:hidden
}
body{min-height:100dvh}
.screen{
 min-height:100dvh;position:relative;padding:0 20px;
 background:#17181c
}
.top{

 border-radius:0 0 42% 0/0 0 23% 0
}
.brand{
 display:inline-flex;align-items:center;gap:9px;
 font-size:31px;font-weight:800;letter-spacing:-1px
}
.logoImg{
 width:43px;height:43px;object-fit:contain;
 display:block;flex:none
}
.back{
 position:absolute;top:61px;left:39px;
 font-size:38px;font-weight:200;line-height:28px
}
.help{
 position:absolute;top:57px;right:38px;
 width:34px;height:34px;border:3px solid #fff;
 border-radius:50%;font-size:24px;font-weight:700;
 line-height:28px;cursor:pointer;z-index:20
}
.title{
 font-size:29px;line-height:1.18;text-align:center;

}
.field{
 width:100%;height:70px;border-radius:23px;
 background:#4a4b5c;display:flex;align-items:center;
 padding:0 19px;color:#d9d9df;font-size:24px;
 position:relative;z-index:2
}
.flag{font-size:25px;margin-right:9px}
.phone{

 background:transparent;border:0;outline:0;color:#fff;
 font-size:24px;font-family:Arial,Helvetica,sans-serif;
 caret-color:#1687f5;-webkit-appearance:none;
 appearance:none;pointer-events:auto;position:relative;z-index:3
}
.phone::placeholder{color:#c9c9d0;opacity:.95}
.hint{
 font-size:18px;line-height:1.25;color:#777982;
 margin:9px 18px 0
}
.next{
 position:absolute;left:20px;right:20px;bottom:110px;
 height:64px;border:0;border-radius:22px;
 background:#35363b;color:#777980;font-size:22px;
 font-weight:500;-webkit-tap-highlight-color:transparent
}
.next.enabled{background:#1687f5;color:#fff}
.legal{
 position:absolute;left:22px;right:22px;bottom:17px;
 text-align:center;color:#ddd;font-size:16px;line-height:1.25
}
.legal span{color:#fff}
.hidden{display:none!important}

.passwordWrap{padding-top:25px}
.passwordTitle{
 font-size:30px;text-align:center;line-height:1.2;
 margin:25px auto 18px
}
.passwordHint{
 text-align:center;color:#8a8b92;font-size:17px;
 margin:0 auto 22px
}
.passfield{
 width:100%;height:70px;border-radius:23px;
 background:#4a4b5c;padding:0 19px;
 display:flex;align-items:center;position:relative;z-index:2
}
.pass{
 width:1px;flex:1;min-width:0;height:52px;padding:0;
 border:0;outline:0;background:transparent;color:white;
 font-size:24px;font-family:Arial,Helvetica,sans-serif;
 caret-color:#1687f5;-webkit-appearance:none;
 appearance:none;position:relative;z-index:3
}
.pass::placeholder{color:#c9c9d0}
